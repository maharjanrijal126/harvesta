name: harvesta
description: "Harvesta - B2B fresh produce procurement for Nepal (Business, Farmer and Admin apps)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  provider: ^6.1.2
  intl: ^0.20.2
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#F9F5E5"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
